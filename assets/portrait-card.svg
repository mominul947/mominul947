<svg width="340" height="390" viewBox="0 0 340 390" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="340" y2="390" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#070B14"/>
      <stop offset="50%" stop-color="#0C1426"/>
      <stop offset="100%" stop-color="#130E24"/>
    </linearGradient>
    <linearGradient id="neon" x1="0" y1="0" x2="340" y2="390" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#10B981"/>
      <stop offset="50%" stop-color="#06B6D4"/>
      <stop offset="100%" stop-color="#A855F7"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="38%" r="48%">
      <stop offset="0%" stop-color="#10B981" stop-opacity="0.38"/>
      <stop offset="60%" stop-color="#8B5CF6" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#070B14" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="picClip">
      <rect x="45" y="24" width="250" height="236" rx="18"/>
    </clipPath>
  </defs>
  <style>
    @keyframes floatY {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-5px); }
    }
    @keyframes pulseStroke {
      0%, 100% { stroke-opacity: 0.45; }
      50% { stroke-opacity: 0.95; }
    }
    .card-stroke { animation: pulseStroke 3.5s ease-in-out infinite; }
    .float-pill { animation: floatY 3.5s ease-in-out infinite; }
  </style>

  <rect class="card-stroke" x="2" y="2" width="336" height="386" rx="18" fill="url(#bg)" stroke="url(#neon)" stroke-width="1.6"/>
  <circle cx="170" cy="145" r="145" fill="url(#glow)"/>

  <!-- Glowing Portrait Frame -->
  <rect x="42" y="21" width="256" height="242" rx="20" fill="#070B14" stroke="url(#neon)" stroke-width="2"/>
  <image href="data:image/jpeg;base64," x="45" y="24" width="250" height="236" clip-path="url(#picClip)" preserveAspectRatio="xMidYMid slice"/>

  <!-- Floating Status Pill -->
  <g class="float-pill">
    <rect x="85" y="246" width="170" height="26" rx="13" fill="#0F172A" stroke="#10B981" stroke-width="1.3"/>
    <text x="170" y="263" text-anchor="middle" fill="#6EE7B7" font-family="ui-monospace, Menlo, monospace" font-size="11" font-weight="700">⚡ MOM TECH BD</text>
  </g>

  <!-- Bottom Highlights -->
  <text x="170" y="298" text-anchor="middle" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="800">Mominul Islam</text>
  <text x="170" y="320" text-anchor="middle" fill="#94A3B8" font-family="ui-monospace, Menlo, monospace" font-size="11.5">Full-Stack &amp; Mobile Architect</text>

  <!-- Mini Metric Pills -->
  <rect x="24" y="338" width="140" height="32" rx="8" fill="#0B1322" stroke="#10B981" stroke-opacity="0.45"/>
  <text x="94" y="358" text-anchor="middle" fill="#34D399" font-family="ui-monospace, Menlo, monospace" font-size="11.5" font-weight="700">🚀 5K+ Installs</text>

  <rect x="176" y="338" width="140" height="32" rx="8" fill="#0B1322" stroke="#06B6D4" stroke-opacity="0.45"/>
  <text x="246" y="358" text-anchor="middle" fill="#67E8F9" font-family="ui-monospace, Menlo, monospace" font-size="11.5" font-weight="700">⭐ 4.7★ – 5.0★</text>
</svg>
