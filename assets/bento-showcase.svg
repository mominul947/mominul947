<svg width="900" height="360" viewBox="0 0 900 360" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="900" y2="360" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#060A14"/>
      <stop offset="50%" stop-color="#0C1324"/>
      <stop offset="100%" stop-color="#110E24"/>
    </linearGradient>
    <linearGradient id="neon" x1="0" y1="0" x2="900" y2="360" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#10B981"/>
      <stop offset="50%" stop-color="#06B6D4"/>
      <stop offset="100%" stop-color="#A855F7"/>
    </linearGradient>
    <radialGradient id="centerAura" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#10B981" stop-opacity="0.45"/>
      <stop offset="50%" stop-color="#A855F7" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#060A14" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="centerClip">
      <circle cx="450" cy="180" r="56"/>
    </clipPath>
  </defs>
  <style>
    @keyframes spin {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }
    @keyframes pulse {
      0%, 100% { opacity: 0.55; }
      50% { opacity: 1; }
    }
    .ring-spin { transform-origin: 450px 180px; animation: spin 12s linear infinite; }
    .pulse-card { animation: pulse 4s ease-in-out infinite; }
  </style>

  <!-- Outer Frame -->
  <rect x="2" y="2" width="896" height="356" rx="20" fill="url(#bg)" stroke="url(#neon)" stroke-width="1.6" stroke-opacity="0.5"/>

  <!-- Bento Grid Divider Lines -->
  <line x1="450" y1="16" x2="450" y2="344" stroke="url(#neon)" stroke-width="1" stroke-opacity="0.35"/>
  <line x1="16" y1="180" x2="884" y2="180" stroke="url(#neon)" stroke-width="1" stroke-opacity="0.35"/>

  <!-- Top-Left: Carbook -->
  <g>
    <rect x="20" y="18" width="350" height="144" rx="14" fill="#0B1322" fill-opacity="0.7" stroke="#10B981" stroke-opacity="0.35"/>
    <rect x="36" y="34" width="94" height="22" rx="11" fill="#064E3B"/>
    <text x="83" y="49" text-anchor="middle" fill="#6EE7B7" font-family="ui-monospace, Menlo, monospace" font-size="10.5" font-weight="700">5K+ DOWNLOADS</text>
    <rect x="138" y="34" width="54" height="22" rx="11" fill="#0F172A" stroke="#10B981" stroke-opacity="0.5"/>
    <text x="165" y="49" text-anchor="middle" fill="#FDE68A" font-family="ui-monospace, Menlo, monospace" font-size="10.5" font-weight="700">4.7★</text>
    <text x="36" y="84" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="800">Carbook</text>
    <text x="36" y="108" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13">On-demand car rental &amp; intercity ride</text>
    <text x="36" y="126" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13">platform live on Google Play &amp; Web.</text>
    <text x="36" y="148" fill="#34D399" font-family="ui-monospace, Menlo, monospace" font-size="11.5" font-weight="600">Flutter • Node.js • Maps API • Firebase</text>
  </g>

  <!-- Top-Right: Repairmate Pro -->
  <g>
    <rect x="530" y="18" width="350" height="144" rx="14" fill="#0B1322" fill-opacity="0.7" stroke="#06B6D4" stroke-opacity="0.35"/>
    <rect x="772" y="34" width="92" height="22" rx="11" fill="#164E63"/>
    <text x="818" y="49" text-anchor="middle" fill="#67E8F9" font-family="ui-monospace, Menlo, monospace" font-size="10.5" font-weight="700">5.0★ RATED</text>
    <rect x="688" y="34" width="76" height="22" rx="11" fill="#0F172A" stroke="#06B6D4" stroke-opacity="0.5"/>
    <text x="726" y="49" text-anchor="middle" fill="#A5F3FC" font-family="ui-monospace, Menlo, monospace" font-size="10.5" font-weight="700">GOOGLE PLAY</text>
    <text x="864" y="84" text-anchor="end" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="800">Repairmate Pro</text>
    <text x="864" y="108" text-anchor="end" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13">Smart task management &amp; workflow</text>
    <text x="864" y="126" text-anchor="end" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13">organizer built for mobile productivity.</text>
    <text x="864" y="148" text-anchor="end" fill="#38BDF8" font-family="ui-monospace, Menlo, monospace" font-size="11.5" font-weight="600">Flutter • Firebase Cloud • REST API</text>
  </g>

  <!-- Bottom-Left: 3D Developer Portfolio -->
  <g>
    <rect x="20" y="198" width="350" height="144" rx="14" fill="#0B1322" fill-opacity="0.7" stroke="#A855F7" stroke-opacity="0.35"/>
    <rect x="36" y="214" width="112" height="22" rx="11" fill="#3B0764"/>
    <text x="92" y="229" text-anchor="middle" fill="#D8B4FE" font-family="ui-monospace, Menlo, monospace" font-size="10.5" font-weight="700">3D WEB STUDIO</text>
    <text x="36" y="264" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="800">3D Portfolio</text>
    <text x="36" y="288" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13">Interactive 3D developer showcase with</text>
    <text x="36" y="306" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13">EN/BN bilingual UI &amp; live theme engine.</text>
    <text x="36" y="328" fill="#C084FC" font-family="ui-monospace, Menlo, monospace" font-size="11.5" font-weight="600">Next.js 14 • TypeScript • Three.js</text>
  </g>

  <!-- Bottom-Right: Mom Tech BD -->
  <g>
    <rect x="530" y="198" width="350" height="144" rx="14" fill="#0B1322" fill-opacity="0.7" stroke="#10B981" stroke-opacity="0.35"/>
    <rect x="748" y="214" width="116" height="22" rx="11" fill="#064E3B"/>
    <text x="806" y="229" text-anchor="middle" fill="#6EE7B7" font-family="ui-monospace, Menlo, monospace" font-size="10.5" font-weight="700">SOFTWARE STUDIO</text>
    <text x="864" y="264" text-anchor="end" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="800">Mom Tech BD</text>
    <text x="864" y="288" text-anchor="end" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13">Engineering scalable web, mobile &amp; cloud</text>
    <text x="864" y="306" text-anchor="end" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13">systems from Bogura, Bangladesh.</text>
    <text x="864" y="328" text-anchor="end" fill="#34D399" font-family="ui-monospace, Menlo, monospace" font-size="11.5" font-weight="600">FastAPI • MongoDB • Linux VPS • Nginx</text>
  </g>

  <!-- Central Glowing Portrait Hub (GrahamTheDevRel style) -->
  <circle cx="450" cy="180" r="105" fill="url(#centerAura)"/>
  <g class="ring-spin">
    <circle cx="450" cy="180" r="66" stroke="url(#neon)" stroke-width="3" stroke-dasharray="110 30 50 30" stroke-linecap="round"/>
  </g>
  <circle cx="450" cy="180" r="58" fill="#060A14" stroke="url(#neon)" stroke-width="2"/>
  <image href="data:image/jpeg;base64," x="394" y="124" width="112" height="112" clip-path="url(#centerClip)" preserveAspectRatio="xMidYMid slice"/>
</svg>
